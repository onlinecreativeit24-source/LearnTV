name: LearnTV Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Check Android build configuration
        run: |
          echo "=== Gradle wrapper ==="
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Android Gradle Plugin ==="
          grep -R -n "com.android.tools.build:gradle\|com.android.application.*version\|com.android.tools.build:gradle" android/build.gradle android/settings.gradle android/gradle 2>/dev/null || true
          echo "=== Package scripts ==="
          npm run
          echo "=== Java ==="
          java -version

      - name: Clean Gradle build
        working-directory: android
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Diagnose AAPT2
        run: |
          echo "=== AAPT2 locations ==="
          find "$ANDROID_HOME" -type f -name aapt2 -print
          echo "=== AAPT2 version ==="
          AAPT2="$(find "$ANDROID_HOME" -type f -name aapt2 | head -1)"
          if [ -n "$AAPT2" ]; then
            "$AAPT2" version || true
            file "$AAPT2" || true
          fi
          echo "=== Java ==="
          java -version
          echo "=== Gradle ==="
          cd android
          ./gradlew --version

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnTV-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
