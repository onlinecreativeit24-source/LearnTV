name: LearnTV Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Clean Gradle build
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK and JavaScript bundle
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            find android/app/build/outputs -type f -name '*.apk' -print
            exit 1
          fi

          echo "=== APK FILE ==="
          ls -lh "$APK"

          echo "=== VERIFY JAVASCRIPT BUNDLE ==="
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle|assets/.*\.bundle' || {
            echo "ERROR: JavaScript bundle was not found inside the APK."
            exit 1
          }

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnTV-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
